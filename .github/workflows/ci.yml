name: ci
on:
  push:
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thanatos-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: thanatos-backend/package-lock.json
      - run: npm ci
      - run: npx hardhat test
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thanatos-backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: thanatos-backend/functions/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in thanatos-frontend/public/js/*.js; do node --check "$f"; done
